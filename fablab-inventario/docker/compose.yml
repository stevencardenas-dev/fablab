# Stack completo: MySQL + API + web. Desde fablab-inventario/:
#   cp docker/.env.example docker/.env   (y poner contraseñas reales)
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
# Sin --build descarga las imágenes publicadas en ghcr.io (workflow imagenes.yml);
# con --build las compila aquí mismo desde el código.
name: fablab-stack

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en docker/.env}
      MYSQL_DATABASE: fablab
      # Usuario de la app: solo tiene permisos sobre la base fablab (no es root)
      MYSQL_USER: fablab
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?define MYSQL_APP_PASSWORD en docker/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Solo se usa en el primer arranque (volumen vacío)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": MySQL no se publica fuera de la red de Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
      # La primera carga (01-inventario.sql) puede pasar de los 200 s de arriba en
      # un servidor lento; los fallos dentro de este margen no cuentan
      start_period: 300s

  api:
    image: ghcr.io/stevencardenas-dev/fablab-api:${APP_VERSION:-estable}
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # deploy:
    #   resources:
    #     limits: { cpus: '2.0', memory: 1G }
    #     reservations: { cpus: '0.25', memory: 256M }
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: fablab
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?define MYSQL_APP_PASSWORD en docker/.env}
      MYSQL_DATABASE: fablab
      LIMITE_ESCRITURAS_MIN: ${LIMITE_ESCRITURAS_MIN:-120}
      API_TOKEN: ${API_TOKEN:?define API_TOKEN en docker/.env}
      # Cuenta del laboratorio (inicio de sesión en la app)
      CUENTA_USUARIO: ${CUENTA_USUARIO:?define CUENTA_USUARIO en docker/.env}
      CUENTA_CLAVE_HASH: ${CUENTA_CLAVE_HASH:?define CUENTA_CLAVE_HASH en docker/.env}
      SESION_SECRETO: ${SESION_SECRETO:?define SESION_SECRETO en docker/.env}
      # Turnstile (captcha del login). Vacíos = sin captcha. El secret y los
      # hostnames solo los usa la API; el sitekey se hornea en el build de web.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      # Mismo dominio (nginx reenvía /api): sin CORS para otros sitios
      CORS_ORIGIN: ""
    # Sin "ports": la API solo se alcanza a través de web (/api)

  web:
    image: ghcr.io/stevencardenas-dev/fablab-web:${APP_VERSION:-estable}
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        EXPO_PUBLIC_TURNSTILE_SITEKEY: ${EXPO_PUBLIC_TURNSTILE_SITEKEY:-}
    restart: unless-stopped
    # La API publica su propio healthcheck (Dockerfile HEALTHCHECK),
    # así que esperamos una API realmente viva antes de arrancar nginx.
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    # Reservas y tope de RAM/CPU: ajusta a tu servidor si hace falta.
    # deploy:
    #   resources:
    #     limits: { cpus: '2.0', memory: 512M }
    #     reservations: { cpus: '0.25', memory: 128M }


volumes:
  mysql_data:
