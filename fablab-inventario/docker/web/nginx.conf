server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API vive detrás del mismo dominio: el bundle llama a /api (relativo)
  client_max_body_size 5m;
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:3001; }

  # Deep links (/sala/1) se resuelven en el cliente
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
