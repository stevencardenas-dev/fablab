# Caché por ruta con un map: un add_header dentro de un location anula TODOS los
# del server, y así index.html (la página que importa) salía sin las cabeceras
# de seguridad. Valor vacío = la cabecera no se envía.
map $uri $cache_control {
  /sw.js         "no-cache";
  /index.html    "no-cache";
  ~^/_expo/      "public, max-age=31536000, immutable";
  default        "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Seguridad por defecto (el mismo origen es el que se sirve, pero el navegador
  # no debería incrustar la app ni adivinar tipos). El escáner usa la cámara, por
  # eso la política de permisos la deja activa para el mismo origen.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Cache-Control $cache_control;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API vive detrás del mismo dominio: el bundle llama a /api (relativo)
  client_max_body_size 5m;
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # La API toma la primera IP de X-Forwarded-For: se reemplaza (no se añade) para
    # que el cliente no la invente y se salte el límite de escrituras. Detrás del
    # proxy HTTPS todos comparten su IP; con varios usuarios, usar real_ip.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:3001; }

  # No dejar leer archivos ocultos (cortesía: prefijos '.' no deben servirse)
  location ~ /\\. { return 404; }

  # Deep links (/sala/1) se resuelven en el cliente
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
